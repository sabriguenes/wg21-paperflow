[project]
name = "wg21-paperflow"
version = "0.3.0"
description = "WG21 paper ingestion and conversion: paperstore + mailing + tomd + cli"
requires-python = ">=3.12"
license = {text = "BSL-1.0"}
authors = [{name = "Vinnie Falco", email = "vinnie.falco@gmail.com"}]
dependencies = [
    "paperstore",
    "mailing",
    "tomd",
    "pipeline",
    "advocatus",
    "agora",
    "assay",
    "cli",
    "preview",
]

[dependency-groups]
dev = ["pytest~=8.0", "ruff~=0.6", "pyright>=1.1"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
paperstore   = {workspace = true}
mailing      = {workspace = true}
tomd         = {workspace = true}
pipeline     = {workspace = true}
advocatus    = {workspace = true}
agora        = {workspace = true}
assay        = {workspace = true}
cli          = {workspace = true}
preview      = {workspace = true}
scrivener  = {git = "https://github.com/gregjkal/wg21-scrivener.git"}

[tool.pytest.ini_options]
testpaths = [
    "packages/paperstore/tests",
    "packages/mailing/tests",
    "packages/tomd/tests",
    "packages/pipeline/tests",
    "packages/advocatus/tests",
    "packages/agora/tests",
    "packages/assay/tests",
    "packages/cli/tests",
    "packages/preview/tests",
    "tests",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["packages"]
exclude = ["**/tests/**"]
reportPrivateImportUsage = "warning"
reportOptionalMemberAccess = "warning"

[tool.ruff.lint.per-file-ignores]
# Tests intentionally:
#   F811: re-export pytest fixtures with `from x import store  # noqa: F401`
#         then take `store` as a parameter, which ruff reads as redefinition.
#   F841: assign to a variable to call a function for its side effects, then
#         assert on the side-effected object instead of the return value.
#   E741: use single-letter `l` as a stand-in for `line` in tight scopes.
#   E402: insert sys.path before importing the package under test when run
#         as a script (test_emit).
"**/tests/**" = ["F811", "F841", "E741", "E402"]
