[project]
name = "assay"
version = "0.4.1"
description = "WG21 paper assay pipeline (two-pass structural analysis)"
requires-python = ">=3.12"
license = {text = "BSL-1.0"}
authors = [{name = "Vinnie Falco", email = "vinnie.falco@gmail.com"}]
dependencies = [
    "jinja2",
    "numpy",
    "paperstore",
    "pipeline",
    "pydantic-ai",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]
