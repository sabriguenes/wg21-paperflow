[project]
name = "advocatus"
version = "0.1.0"
description = "WG21 paper examination pipeline (Advocatus Diaboli / Defensor Causae)"
requires-python = ">=3.12"
license = {text = "BSL-1.0"}
authors = [{name = "Vinnie Falco", email = "vinnie.falco@gmail.com"}]
dependencies = [
    "jinja2",
    "paperstore",
    "pipeline",
    "pydantic-ai",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advocatus"]
