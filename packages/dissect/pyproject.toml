[project]
name = "dissect"
version = "0.3.0"
description = "WG21 paper dissect pipeline (LLM-driven, paperstore-aware)"
requires-python = ">=3.12"
license = {text = "BSL-1.0"}
authors = [{name = "Vinnie Falco", email = "vinnie.falco@gmail.com"}]
dependencies = [
    "paperstore",
    "pipeline",
    "pydantic-ai",
    "pydantic>=2.0",
    "pymupdf~=1.27.0",
    # Embedding triage and dedup shadow. Step 9 Verify and Step 10
    # Load-Bearing depend on this for bounded per-LLM-call inputs;
    # the dedup shadow uses it for observational merge proposals.
    # First run downloads BAAI/bge-small-en-v1.5 (~120MB) into the
    # local Hugging Face cache. Use `dissect-prefetch-embedding-model`
    # to pre-warm it deterministically (e.g. in CI).
    "sentence-transformers>=3.0.0",
    # Sentence boundary disambiguation for Step 1 Tag Sentences.
    # Rule-based, deterministic; no model download.
    "pysbd>=0.3.4",
]

[project.scripts]
dissect-prefetch-embedding-model = "dissect.shadow:prefetch_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dissect"]
