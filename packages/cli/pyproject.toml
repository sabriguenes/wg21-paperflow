[project]
name = "cli"
version = "0.2.1"
description = "CLI for WG21 paper ingestion and conversion"
requires-python = ">=3.12"
license = {text = "BSL-1.0"}
authors = [{name = "Sergio DuBois", email = "sentientsergio@gmail.com"}]
dependencies = [
    "paperstore",
    "mailing",
    "tomd",
    "rich",
]

[project.scripts]
paperflow = "cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
