[project]
name = "web_tools"
version = "0.1.0"
description = "Resilient multi-backend web search and fetch for LLM pipelines"
requires-python = ">=3.12"
license = {text = "BSL-1.0"}
authors = [{name = "Vinnie Falco", email = "vinnie.falco@gmail.com"}]
dependencies = [
    "httpx",
    "trafilatura",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_tools"]
