[project]
name = "cpp-mcp"
version = "0.1.0"
description = "MCP server for searching and browsing the C++ standard (ISO/IEC 14882)"
requires-python = ">=3.12"
license = {text = "BSL-1.0"}
authors = [{name = "Mungo Gill"}]
dependencies = [
    "fastmcp>=3.0",
]

[project.scripts]
cpp-mcp = "cpp_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpp_mcp"]
