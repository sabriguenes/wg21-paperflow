# Infrastructure inventory.
# API keys are NEVER stored here. Set via environment variables.
#
# Two parallel namespaces live in this file:
#
# 1. [services.NAME] declares a remote LLM endpoint with its
#    capabilities. The `backend` field maps to a Python class in
#    pipeline.model_backends. The `api_key_env` field names the env var
#    holding the API key.
#    [defaults] maps slot names to service names for interactive use.
#    The orchestrator overrides slots via --service CLI flags.
#
# 2. [classifiers.NAME] declares a local zero-shot text classifier. The
#    `backend` field maps to a Python class in
#    pipeline.classifier_backends. No api_key_env: classifiers are
#    local-model wrappers (HF Transformers pipeline or
#    sentence_transformers CrossEncoder). First run downloads weights
#    into the local HF cache; subsequent runs are fully offline.
#    [classifier_defaults] maps classifier slot names to classifier
#    names. The orchestrator overrides via --classifier CLI flags
#    (e.g. `--classifier selector=zeroshot-base`).
#
# The two namespaces do not mix: slot resolution is independent, and
# `--service` / `--classifier` flags target different dicts on the
# StepContext.

[services.b200-r1]
backend = "deepseek_r1_distill_vllm021"
base_url = "https://hdsfzi29n4xyup-8000.proxy.runpod.net/v1"
api_key_env = "RUNPOD_API_KEY"
model = "deepseek-r1-distill-70b"
thinking_capable = true
tools_capable = false

