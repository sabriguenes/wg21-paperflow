[services.anthropic-opus]
backend = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-opus-4-6"
thinking_capable = true
tools_capable = true

[defaults]
fast = "anthropic-opus"
default = "anthropic-opus"
tool = "anthropic-opus"

# ---------------------------------------------------------------------------
# Local zero-shot classifiers (dissect Step 1 Tag Sentences)
# ---------------------------------------------------------------------------

# Default: small NLI cross-encoder. ~150MB, ~15-25ms/sentence on CPU.
# With the cross-validated TARGET hypothesis label and structural
# pre-filter in harness.py, this model achieves 96% TARGET recall and
# 92% SKIP recall across three WG21 corpora -- matching or beating
# zeroshot-large on the decisions that matter (TARGET recall) at
# 1/85th the cost. See study/ensemble/results/final_findings.md for
# the apples-to-apples ablation.
[classifiers.nli-small]
backend = "nli_cross_encoder"
model = "cross-encoder/nli-deberta-v3-small"

# Large alternative: DeBERTa-v3-large fine-tuned for zero-shot
# classification on 5 NLI + 28 non-NLI datasets. ~1.7GB FP32, ~1.5s
# per sentence on CPU. Sharper raw scores than nli-small but the
# final-decision quality is equivalent once the alt TARGET hypothesis
# is in place. Use via `--classifier selector=zeroshot-large` when
# you want the model's confidence numbers themselves (e.g. for the
# Tier 3 cascade oracle slot described in study/ensemble/).
[classifiers.zeroshot-large]
backend = "zeroshot_v2"
model = "MoritzLaurer/deberta-v3-large-zeroshot-v2.0"

# Mid-tier: DeBERTa-v3-base, same fine-tune family as zeroshot-large.
# ~700MB FP32, sub-second per chunk on CPU. Use via `--classifier
# selector=zeroshot-base` when you need a faster iteration loop than
# zeroshot-large but want sharper scores than nli-small.
[classifiers.zeroshot-base]
backend = "zeroshot_v2"
model = "MoritzLaurer/deberta-v3-base-zeroshot-v2.0"

# Example future addition: specialized claim detector. Demonstrates
# that the abstraction makes adding a new classifier a config change,
# not a code change. Requires registering a "claimbuster" entry in
# CLASSIFIER_BACKEND_REGISTRY first.
# [classifiers.claimbuster]
# backend = "claimbuster"
# model = "lukasgarbas/claimbuster-multilingual"  # or a local fine-tune

[classifier_defaults]
selector = "nli-small"

# ---------------------------------------------------------------------------
# Transformer providers (device / dtype / batching for HF + CrossEncoder)
# ---------------------------------------------------------------------------

# Detect the host at startup. Suited to dev machines and CI.
# Picks cuda > mps > cpu; bf16 on Ampere+, fp16 on older CUDA, fp32
# elsewhere. `max_batch_size` caps the auto-picked default (cuda=64,
# mps=32, cpu=16).
[transformer_providers.auto]
mode = "auto"
max_batch_size = 64
max_length = 192
executor_workers = 1

# Provisioned cloud (e.g. RunPod B200, A100). Explicit values fail
# fast on misconfiguration instead of silently degrading to CPU.
[transformer_providers.cuda-b200]
mode = "explicit"
device = "cuda"
dtype = "bf16"
batch_size = 64
max_length = 192
executor_workers = 1

# Older CUDA (Turing / Volta) where bf16 is unsupported. fp16 avoids
# the CrossEncoder NaN bug because batched logits stay > 1e3 absolute
# value for typical inputs; if you observe NaNs, switch to cpu-fp32.
[transformer_providers.cuda-fp16]
mode = "explicit"
device = "cuda"
dtype = "fp16"
batch_size = 48
max_length = 192
executor_workers = 1

# Deterministic CPU fallback. Use to bisect when an MPS or CUDA
# result looks wrong (e.g. CrossEncoder NaN logits on Turing).
[transformer_providers.cpu-fp32]
mode = "explicit"
device = "cpu"
dtype = "fp32"
batch_size = 16
max_length = 192
executor_workers = 1

[transformer_provider_defaults]
default = "auto"
